<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepStyle - Loja de Sapatos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>StepStyle</h1>
            <nav class="menu">
                <a href="#">Início</a>
                <a href="#">Masculino</a>
                <a href="#">Feminino</a>
                <a href="#contato">Contato</a>
            </nav><!--  -->
        </header>

        <section class="banner">
            <h2>Nova Coleção 2026</h2>
        </section>

        <main class="products">
            <section class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Tênis 1">
                <h3>Tênis Esportivo</h3>
                <p>R$ 199,90</p>
                <button>Comprar</button>
            </section>

            <section class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Tênis 2">
                <h3>Tênis Casual</h3>
                <p>R$ 149,90</p>
                <button>Comprar</button>
            </section>

            <section class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Tênis 3">
                <h3>Sapato Social</h3>
                <p>R$ 249,90</p>
                <button>Comprar</button>
            </section>

            <section class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Tênis 4">
                <h3>Tênis Street</h3>
                <p>R$ 179,90</p>
                <button>Comprar</button>
            </section>

            <section class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Tênis 5">
                <h3>Tênis Street</h3>
                <p>R$ 179,90</p>
                <button>Comprar</button>
            </section>

            <section class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Tênis 6">
                <h3>Sapato Feminino</h3>
                <p>R$ 379,90</p>
                <button>Comprar</button>
            </section>

            <section id="contato" class="formulario">
                <h2>Contato</h2>
                <form action="">
                    <input type="text" placeholder="Insira seu nome">
                    <input type="text" placeholder="email@email.com.br">
                    <input type="fone" placeholder="(99)99999-9999">
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 StepStyle - Todos os direitos reservados</p>
        </footer>

    </div>

</body>

</html>
